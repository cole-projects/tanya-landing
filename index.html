    <style>
      @keyframes initial-splash-spiral-rotate {
        to {
          transform: rotate(360deg);
        }
      }
      .initial-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        text-align: center;
        background: #f1f6f4;
        color: #52333a;
      }
      .initial-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.125rem;
      }
      .initial-splash-spiral {
        width: 5rem;
        height: auto;
        max-height: 4.65rem;
        flex-shrink: 0;
        display: block;
        object-fit: contain;
        object-position: center;
        animation: initial-splash-spiral-rotate 1.35s linear infinite;
        transform-origin: 50% 50%;
      }
      .initial-splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #171717;
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-splash-spiral {
          animation: none;
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>

        "
      >
        Enable JavaScript to view TanyaTalk.
      </p>
    </noscript>
    <div id="root">
      <div class="initial-splash">
        <div class="initial-splash__inner">
          <img
            class="initial-splash-spiral"
            src="/loading-spiral.png"
            alt=""
            width="104"
            height="96"
            decoding="async"
            aria-hidden="true"
          />
          <p class="initial-splash__title">TanyaTalk</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
